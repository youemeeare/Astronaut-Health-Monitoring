services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/astra_med.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    volumes:
      - astra_data:/data
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/workspace
    depends_on: [api]
volumes:
  astra_data:
